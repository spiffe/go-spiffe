name: PR Build
on:
  pull_request:
  merge_group:
  workflow_dispatch:
env:
  # Go version for the jobs that cover ML-DSA support.
  GO_1_27_VERSION: 1.27.3
jobs:
  lint-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Lint
        run: make lint

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Test
        run: make test

  # ML-DSA support needs Go 1.27 or later, but go.mod targets an older Go
  # version, so the jobs above skip the ML-DSA tests and don't lint the files
  # that need Go 1.27. These jobs cover them.
  lint-linux-go1-27:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version: ${{ env.GO_1_27_VERSION }}
      - name: Lint
        run: make lint go_version_full=${{ env.GO_1_27_VERSION }}

  test-linux-go1-27:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version: ${{ env.GO_1_27_VERSION }}
      - name: Test
        run: make test go_version_full=${{ env.GO_1_27_VERSION }}

  lint-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Install msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel 
            mingw-w64-x86_64-toolchain 
            unzip 
      - name: Lint
        run: make lint

  test-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Install msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel 
            mingw-w64-x86_64-toolchain 
            unzip 
      - name: Test
        run: make test

  # This job is just here to make sure that the other jobs have completed
  # and is used as a single job to block PR merge from. GH doesn't have a
  # way to say "all jobs from this action", which would be ideal.
  success:
    needs: [lint-linux, test-linux, lint-linux-go1-27, test-linux-go1-27, lint-windows, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Shout it out
        run: echo SUCCESS

